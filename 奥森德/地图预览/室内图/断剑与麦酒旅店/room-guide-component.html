<style>
#okh-inn-guide{--ig-gold:var(--okh-gold-main,#dfc89a);--ig-sub:var(--okh-text-sub,#b3a594);--ig-line:rgba(223,200,154,.2);color:var(--okh-text-main,#e8dfd3);margin:16px 0 4px;font-size:12px;line-height:1.6}
#okh-inn-guide *{box-sizing:border-box}
#okh-inn-guide [hidden]{display:none!important}
#okh-inn-guide p,#okh-inn-guide h2,#okh-inn-guide h3,#okh-inn-guide figure{margin:0}
#okh-inn-guide button{font:inherit;cursor:pointer;min-height:44px;border:0;background:transparent;color:var(--ig-sub)}
#okh-inn-guide button:focus-visible{outline:2px solid var(--ig-gold);outline-offset:2px}
#okh-inn-guide .ig-path{font-size:10px;letter-spacing:1px;color:var(--ig-sub)}
#okh-inn-guide .ig-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:5px 0 10px}
#okh-inn-guide h2{font:500 19px/1.5 'Songti SC','Noto Serif CJK SC','SimSun',serif;letter-spacing:1px;color:var(--ig-gold)}
#okh-inn-guide .ig-floors{display:flex;gap:14px;flex-shrink:0}
#okh-inn-guide .ig-floors button{position:relative;padding:7px 0;white-space:nowrap}
#okh-inn-guide .ig-floors [aria-pressed=true]{color:var(--ig-gold)}
#okh-inn-guide .ig-floors [aria-pressed=true]:after{content:'';position:absolute;bottom:3px;left:0;right:0;height:1px;background:var(--ig-gold)}
#okh-inn-guide .ig-image-wrap{position:relative;border:1px solid var(--ig-line);border-radius:2px;overflow:hidden;background:#dbb880}
#okh-inn-guide .ig-image-wrap img{display:block;width:100%;height:auto;aspect-ratio:1672/941}
#okh-inn-guide .ig-door{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);padding:3px;min-width:44px;min-height:44px;color:#50341e}
#okh-inn-guide .ig-door span{display:block;background:rgba(243,217,169,.95);padding:3px 8px;border:1px solid #967044;box-shadow:0 1px 3px #68461c22;border-radius:2px;font-family:'Songti SC','Noto Serif CJK SC',serif;font-size:12px;white-space:nowrap}
#okh-inn-guide .ig-door .ig-num{display:none}
#okh-inn-guide .ig-door[aria-pressed=true] span{background:#553b25;color:#ffedc8;border-color:#f3d193}
#okh-inn-guide .ig-door:hover span{outline:1px solid #6b4a2b;outline-offset:2px}
#okh-inn-guide .ig-door .ig-label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 6px}
#okh-inn-guide .ig-class-icon{display:inline-block;width:var(--ig-icon-size,18px);height:var(--ig-icon-size,18px);flex-shrink:0;background-image:var(--ig-class-atlas,url('../../职业图标/class-icons.webp'));background-size:500% 166.666667%;background-position:var(--ig-icon-x,0%) 50%;vertical-align:middle}
#okh-inn-guide .ig-player-icon{display:inline-grid;place-items:center;width:var(--ig-icon-size,18px);height:var(--ig-icon-size,18px);border:1px solid currentColor;border-radius:50%;font:normal 12px 'Noto Serif CJK SC','Songti SC',serif;flex-shrink:0;color:inherit;vertical-align:middle}
#okh-inn-guide .ig-room-top .ig-sigil{border:0}
#okh-inn-guide .ig-sigil .ig-class-icon,#okh-inn-guide .ig-sigil .ig-player-icon{--ig-icon-size:32px}
#okh-inn-guide .ig-paper-note{position:absolute;left:5%;top:7%;max-width:36%;color:#735431;font-size:11px;line-height:1.9;pointer-events:none}
#okh-inn-guide .ig-paper-note b{font:500 16px/1.8 'Songti SC','Noto Serif CJK SC',serif;letter-spacing:2px;color:#5c4027}
#okh-inn-guide .ig-mobile-rooms{display:none}
#okh-inn-guide .ig-static-marker{display:none}
#okh-inn-guide .ig-helper{display:flex;flex-wrap:wrap;gap:3px 12px;justify-content:space-between;color:var(--ig-sub);font-size:10px;padding:9px 0;border-bottom:1px solid var(--ig-line)}
#okh-inn-guide .ig-room-panel{padding:14px 0 3px;min-height:70px}
#okh-inn-guide .ig-empty{color:var(--ig-sub);padding:3px 0 9px}
#okh-inn-guide .ig-room-top{display:flex;align-items:center;gap:12px}
#okh-inn-guide .ig-sigil{width:40px;height:46px;flex-shrink:0;display:grid;place-items:center;color:var(--ig-gold);border:1px solid #736044;font:22px 'Songti SC','Noto Serif CJK SC',serif}
#okh-inn-guide h3{font:500 17px/1.7 'Songti SC','Noto Serif CJK SC',serif;color:var(--ig-gold)}
#okh-inn-guide .ig-room-meta{font-size:11px;color:var(--ig-sub)}
#okh-inn-guide .ig-presence{margin-left:auto;font-size:11px;color:var(--ig-sub);text-align:right}
#okh-inn-guide .ig-presence[data-presence=inside]{color:#98b29a}
#okh-inn-guide .ig-actions{display:flex;flex-wrap:wrap;gap:3px 20px;margin-top:6px}
#okh-inn-guide .ig-actions button{color:var(--ig-gold);padding:7px 0;text-align:left}
#okh-inn-guide .ig-actions button:hover{text-decoration:underline;text-underline-offset:5px}
#okh-inn-guide .ig-feedback{color:var(--ig-sub);font-size:11px;min-height:20px}
#okh-inn-guide .ig-draft textarea{width:100%;min-height:70px;background:#1d1711;border:1px solid #5f4d36;color:var(--ig-gold);padding:8px;font:inherit}
#okh-inn-guide .ig-zone-nav{display:flex;flex-wrap:wrap;gap:4px 20px;padding-top:5px;border-bottom:1px solid var(--ig-line)}
#okh-inn-guide .ig-zone-nav button[aria-pressed=true]{color:var(--ig-gold);text-decoration:underline;text-underline-offset:8px}
#okh-inn-guide .ig-zone-text{padding:10px 0;color:var(--ig-sub)}
@media(max-width:700px){
 #okh-inn-guide .ig-heading{align-items:flex-start;gap:5px;flex-wrap:wrap}
 #okh-inn-guide h2{font-size:17px}#okh-inn-guide .ig-floors{gap:16px}
 #okh-inn-guide .ig-door{display:none}
 #okh-inn-guide .ig-static-marker{display:grid;place-items:center;position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;font:10px 'Songti SC',serif;color:#50341e;background:#f3d9a9;pointer-events:none}
 #okh-inn-guide .ig-static-marker.is-selected{outline:1px solid #553b25;outline-offset:2px;background:#553b25}
 #okh-inn-guide .ig-static-marker .ig-class-icon,#okh-inn-guide .ig-static-marker .ig-player-icon{--ig-icon-size:20px}
 #okh-inn-guide .ig-door .ig-label{display:none}#okh-inn-guide .ig-door .ig-num{display:grid;place-items:center;width:24px;height:24px;padding:0;border-radius:50%;font-size:11px}
 #okh-inn-guide .ig-paper-note{font-size:9px;max-width:38%;top:6%}#okh-inn-guide .ig-paper-note b{font-size:13px}
 #okh-inn-guide .ig-mobile-rooms{display:flex;flex-wrap:wrap;gap:0 10px;padding:4px 0}
 #okh-inn-guide .ig-mobile-rooms button{display:inline-flex;align-items:center;gap:4px;padding:5px 0;font-size:12px;min-width:44px}
 #okh-inn-guide .ig-mobile-rooms .ig-class-icon,#okh-inn-guide .ig-mobile-rooms .ig-player-icon{--ig-icon-size:16px}
 #okh-inn-guide .ig-mobile-rooms [aria-pressed=true]{color:var(--ig-gold);text-decoration:underline;text-underline-offset:6px}
 #okh-inn-guide .ig-actions{gap:0 17px}#okh-inn-guide .ig-presence{max-width:100px}
}
</style>
<section id="okh-inn-guide" aria-label="断剑与麦酒旅店导览">
 <div class="ig-path">奥克赫斯 / 室内导览</div>
 <div class="ig-heading"><h2>断剑与麦酒旅店</h2><nav class="ig-floors" aria-label="切换楼层"><button type="button" data-floor="ground" aria-pressed="true">一层 · 大厅</button><button type="button" data-floor="upper" aria-pressed="false">二层 · 客房</button></nav></div>
 <div class="ig-floor-view" data-view="ground">
  <figure class="ig-image-wrap"><img src="ground-scene.webp" width="1672" height="941" alt="旅店一层斜俯视场景：长桌大厅、吧台、厨房、西侧院落与东北折返楼梯。"></figure>
  <nav class="ig-zone-nav" aria-label="一层区域"><button type="button" data-zone="hall" aria-pressed="true">大厅</button><button type="button" data-zone="bar" aria-pressed="false">吧台</button><button type="button" data-zone="kitchen" aria-pressed="false">厨房</button><button type="button" data-zone="yard" aria-pressed="false">后院</button><button type="button" data-upstairs>楼梯 ↑</button></nav>
  <p class="ig-zone-text" aria-live="polite">长桌之间留出通道，连通吧台、厨房与楼梯。</p>
 </div>
 <div class="ig-floor-view" data-view="upper" hidden>
  <figure class="ig-image-wrap"><img src="upper-scene.webp" width="1672" height="941" alt="旅店二层同一侧走廊的一排六扇房门，分别通向伯里、古兰、伊丝娜、妮丝、奥萝拉和爱德的房间；东北楼梯下通一层。">
   <div class="ig-paper-note"><b>二层客房</b><br><span class="ig-paper-instruction">选择住客 · 展开房间</span></div>
   <button type="button" class="ig-door" style="--x:19.4%;--y:81%" data-room="door1" aria-pressed="false"><span class="ig-label">客房 01</span><span class="ig-num" aria-hidden="true">01</span></button>
   <button type="button" class="ig-door" style="--x:29.8%;--y:74.8%" data-room="door2" aria-pressed="false"><span class="ig-label">客房 02</span><span class="ig-num" aria-hidden="true">02</span></button>
   <button type="button" class="ig-door" style="--x:39.6%;--y:68.7%" data-room="door3" aria-pressed="false"><span class="ig-label">客房 03</span><span class="ig-num" aria-hidden="true">03</span></button>
   <button type="button" class="ig-door" style="--x:48.8%;--y:62.8%" data-room="door4" aria-pressed="false"><span class="ig-label">客房 04</span><span class="ig-num" aria-hidden="true">04</span></button>
   <button type="button" class="ig-door" style="--x:57.5%;--y:57.1%" data-room="door5" aria-pressed="false"><span class="ig-label">客房 05</span><span class="ig-num" aria-hidden="true">05</span></button>
   <button type="button" class="ig-door" style="--x:65.7%;--y:51.7%" data-room="door6" aria-pressed="false"><span class="ig-label">客房 06</span><span class="ig-num" aria-hidden="true">06</span></button>
  </figure>
  <nav class="ig-mobile-rooms" aria-label="按姓名选择房间"></nav>
  <div class="ig-helper"><span>选房间 → 查看角色 → 选择行动</span><span class="ig-data-note">入住信息待载入</span></div>
  <section class="ig-room-panel" aria-label="房间与角色">
   <p class="ig-empty">选一扇房门，查看入住角色与可用行动。</p>
   <div class="ig-room-content" hidden><div class="ig-room-top"><div class="ig-sigil" aria-hidden="true"></div><div><h3></h3><p class="ig-room-meta"></p></div><p class="ig-presence"></p></div><nav class="ig-actions" aria-label="房间行动"></nav></div>
  </section>
 </div>
 <p class="ig-feedback" role="status"></p>
 <div class="ig-draft" hidden><textarea aria-label="行动草稿" readonly></textarea><button type="button" data-copy>复制行动</button></div>
</section>
<script>
(() => {
 const root=document.getElementById('okh-inn-guide');
 const roomIds=['door1','door2','door3','door4','door5','door6'];
 let state={demo:false,rooms:[]}, selected=null;
 const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];
 const roomLabel=id=>'客房 '+String(roomIds.indexOf(id)+1).padStart(2,'0');
 const getRoom=id=>state.rooms.find(r=>r.id===id)||{id};
 const classPositions={warrior:0,scout:25,mage:50,cleric:75,support:100};
 function makeIcon(occupant){
  const job=occupant?.classId;
  if(!Object.hasOwn(classPositions,job)&&occupant?.isPlayer){const icon=document.createElement('i');icon.className='ig-player-icon';icon.textContent='你';icon.setAttribute('aria-hidden','true');return icon;}
  if(!Object.hasOwn(classPositions,job))return null;
  const icon=document.createElement('i');icon.className='ig-class-icon';icon.dataset.class=job;icon.style.setProperty('--ig-icon-x',classPositions[job]+'%');icon.setAttribute('aria-hidden','true');return icon;
 }
 function setFloor(floor){
  if(!['ground','upper'].includes(floor))return;
  qa('[data-view]').forEach(el=>el.hidden=el.dataset.view!==floor);
  qa('[data-floor]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.floor===floor)));
  q('.ig-feedback').textContent='';q('.ig-draft').hidden=true;
 }
 function action(label,text){
  const b=document.createElement('button');b.type='button';b.textContent='› '+label;
  b.addEventListener('click',()=>writeIntent(text));q('.ig-actions').append(b);
 }
 function renderRoom(){
  qa('[data-room]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.room===selected)));
  qa('[data-marker]').forEach(m=>m.classList.toggle('is-selected',m.dataset.marker===selected));
  q('.ig-empty').hidden=!!selected;q('.ig-room-content').hidden=!selected;
  if(!selected)return;
  const r=getRoom(selected),o=r.occupant;
  q('.ig-actions').replaceChildren();
  q('.ig-room-content h3').textContent=o?.isPlayer?'你的房间':o?o.name+'的房间':roomLabel(selected);
  q('.ig-sigil').replaceChildren(makeIcon(o)||document.createTextNode(o?o.name.slice(0,1):'◇'));
  q('.ig-room-meta').textContent=roomLabel(selected)+(o&&o.role?' · '+o.role:'');
  const presence=q('.ig-presence');presence.dataset.presence=r.presence||'unknown';
  if(!o){presence.textContent='暂无入住信息';return;}
  if(o.isPlayer){
   presence.textContent='个人房间';
   action('回房休息',`我回到断剑与麦酒旅店二层${roomLabel(selected)}，在自己的房间休息片刻。`);
   action('整理行囊',`我回到断剑与麦酒旅店二层自己的房间，整理随身行囊。`);
   return;
  }
  if(r.presence==='inside'){
   presence.textContent='● 在房';
   action('敲门拜访',`我来到断剑与麦酒旅店二层的${roomLabel(selected)}，敲响${o.name}的房门，等候回应。`);
   action('进屋交谈',`我前往断剑与麦酒旅店二层${o.name}的房间，准备进屋和${o.name}聊聊接下来的安排。`);
  }else if(r.presence==='away'){
   presence.textContent='外出'+(r.location?' · '+r.location:'');
   if(r.location)action('前往寻找',`我前往${r.location}寻找${o.name}。`);
  }else{
   presence.textContent='是否在房待确认';
   action('敲门询问',`我来到断剑与麦酒旅店二层${o.name}的房门前，轻轻敲门，询问${o.name}是否在房。`);
  }
  action('留下口信',`我来到断剑与麦酒旅店二层${o.name}的房门前，留下一张约定稍后见面的字条。`);
 }
 function selectRoom(id){
  if(!roomIds.includes(id))return;
  selected=id;q('.ig-feedback').textContent='';q('.ig-draft').hidden=true;renderRoom();
 }
 function setState(next){
  state={demo:next?.demo===true,rooms:Array.isArray(next?.rooms)?next.rooms.filter(r=>roomIds.includes(r.id)).map(r=>({id:r.id,occupant:r.occupant&&typeof r.occupant.name==='string'?{name:r.occupant.name,id:r.occupant.id,role:r.occupant.role||'',isPlayer:r.occupant.isPlayer===true,classId:Object.hasOwn(classPositions,r.occupant.classId)?r.occupant.classId:''}:null,presence:['inside','away','unknown'].includes(r.presence)?r.presence:'unknown',location:typeof r.location==='string'?r.location:''})):[]};
  q('.ig-mobile-rooms').replaceChildren();
  roomIds.forEach(id=>{
   const r=getRoom(id),name=r.occupant?.name||roomLabel(id),b=q('.ig-door[data-room='+id+']');
   const label=b.querySelector('.ig-label');label.replaceChildren();const icon=makeIcon(r.occupant);if(icon)label.append(icon);label.append(document.createTextNode(name));b.setAttribute('aria-label','查看'+name+'的房间');
   const marker=q('[data-marker='+id+']');if(marker)marker.replaceChildren(makeIcon(r.occupant)||document.createTextNode(String(roomIds.indexOf(id)+1).padStart(2,'0')));
   const item=document.createElement('button');item.type='button';item.dataset.room=id;const mobileIcon=makeIcon(r.occupant);if(mobileIcon)item.append(mobileIcon);item.append(document.createTextNode(name));item.setAttribute('aria-label','选择'+name+'的房间');item.addEventListener('click',()=>selectRoom(id));q('.ig-mobile-rooms').append(item);
  });
  q('.ig-data-note').textContent=state.demo?'入住与动向为演示':'入住信息'+(state.rooms.length?'已载入':'待载入');
  const playerRoom=state.rooms.find(r=>r.occupant?.isPlayer);
  q('.ig-paper-instruction').textContent=playerRoom?roomLabel(playerRoom.id).replace('客房 ','')+' 玩家住处 · 点门查看':'选择住客 · 展开房间';
  renderRoom();
 }
 function findInput(){
  const find=d=>d.getElementById('send_textarea')||d.querySelector('#send_form textarea')||d.getElementById('tavern-input')||d.getElementById('inn-preview-input');
  const own=find(document);if(own)return own;
  try{return window.parent!==window?find(window.parent.document):null;}catch{return null;}
 }
 function writeIntent(text){
  const input=findInput();
  if(input){
   const old=input.value.trimEnd();input.value=old?old+'\n'+text:text;
   input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));input.focus();
   q('.ig-feedback').textContent='已填入输入框，可修改后发送。';
  }else{q('.ig-draft').hidden=false;q('.ig-draft textarea').value=text;q('.ig-feedback').textContent='行动已拟好，可复制后发送。';}
 }
 qa('.ig-door').forEach(b=>b.addEventListener('click',()=>selectRoom(b.dataset.room)));
 qa('.ig-door').forEach(b=>{const marker=document.createElement('span');marker.className='ig-static-marker';marker.dataset.marker=b.dataset.room;marker.setAttribute('style',b.getAttribute('style'));marker.setAttribute('aria-hidden','true');marker.textContent=b.querySelector('.ig-num').textContent;b.after(marker);});
 qa('[data-floor]').forEach(b=>b.addEventListener('click',()=>setFloor(b.dataset.floor)));
 q('[data-upstairs]').addEventListener('click',()=>setFloor('upper'));
 const descriptions={hall:'长桌之间留出通道，连通吧台、厨房与楼梯。',bar:'靠北墙的长吧台，负责酒水与餐食接待。',kitchen:'西侧隔墙后的厨房，门口通向大厅。',yard:'西侧服务院落，从侧门进入旅店。'};
 qa('[data-zone]').forEach(b=>b.addEventListener('click',()=>{qa('[data-zone]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));q('.ig-zone-text').textContent=descriptions[b.dataset.zone];}));
 q('[data-copy]').addEventListener('click',async()=>{const field=q('.ig-draft textarea');try{await navigator.clipboard.writeText(field.value);q('.ig-feedback').textContent='行动已复制。';}catch{field.focus();field.select();q('.ig-feedback').textContent='已选中行动文字，可手动复制。';}});
 window.okhInnGuide={setState,setFloor,selectRoom};setState({rooms:[]});
})();
</script>
