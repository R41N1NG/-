<style>
#okh-inn-scene { --inn-gold:var(--okh-gold-main,#dfc89a); --inn-muted:var(--okh-text-sub,#b3a594); color:var(--okh-text-main,#e8dfd3); margin:18px 0 8px; }
#okh-inn-scene * { box-sizing:border-box; }
#okh-inn-scene .inn-path { font-size:10px; letter-spacing:1px; color:var(--inn-muted); margin-bottom:7px; }
#okh-inn-scene .inn-heading { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
#okh-inn-scene h2 { margin:0; font:500 19px/1.5 'Songti SC','Noto Serif CJK SC','SimSun',serif; color:var(--inn-gold); letter-spacing:1px; }
#okh-inn-scene .inn-floor { white-space:nowrap; font-size:11px; color:var(--inn-muted); }
#okh-inn-scene .inn-picture { margin:0; overflow:hidden; border-radius:2px; border:1px solid rgba(223,200,154,.3); background:#dcb77c; }
#okh-inn-scene img { display:block; width:100%; height:auto; }
#okh-inn-scene .inn-zones { display:flex; flex-wrap:wrap; gap:0 20px; padding:6px 0 0; border-bottom:1px solid rgba(223,200,154,.18); }
#okh-inn-scene button { position:relative; background:transparent; border:0; color:var(--inn-muted); padding:9px 0; min-height:44px; font:inherit; font-size:12px; cursor:pointer; }
#okh-inn-scene button[aria-pressed=true] { color:var(--inn-gold); }
#okh-inn-scene button[aria-pressed=true]:after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:1px; background:var(--inn-gold); }
#okh-inn-scene button:focus-visible { outline:1px solid var(--inn-gold); outline-offset:3px; }
#okh-inn-scene .inn-description { color:var(--inn-muted); font-size:12px; line-height:1.8; padding:10px 0 2px; min-height:36px; }
@media(max-width:480px) { #okh-inn-scene h2 { font-size:17px; } #okh-inn-scene .inn-heading { gap:6px; } #okh-inn-scene .inn-zones { justify-content:space-between; gap:0 10px; } }
</style>
<section id="okh-inn-scene" aria-label="断剑与麦酒旅店一层导览">
  <div class="inn-path">奥克赫斯 / 断剑与麦酒旅店</div>
  <div class="inn-heading"><h2>炉火与麦酒之间</h2><span class="inn-floor">一层 · 酒馆大厅</span></div>
  <figure class="inn-picture"><img src="ground-axon-scene.webp" width="1672" height="941" alt="羊皮纸墨线绘制的旅店一层斜俯视图：大厅与长桌，北侧吧台，西侧厨房和服务院落，东北折返楼梯。墙、桌椅和楼板沿统一的平行投影排列。"></figure>
  <nav class="inn-zones" aria-label="查看区域说明">
    <button type="button" aria-pressed="true" data-zone="hall">大厅</button>
    <button type="button" aria-pressed="false" data-zone="bar">吧台</button>
    <button type="button" aria-pressed="false" data-zone="kitchen">厨房</button>
    <button type="button" aria-pressed="false" data-zone="yard">后院</button>
    <button type="button" aria-pressed="false" data-zone="stairs">楼梯</button>
  </nav>
  <p class="inn-description" aria-live="polite">长桌之间留出通道，连通吧台、厨房与楼梯。</p>
</section>
<script>(() => {
 const root=document.getElementById('okh-inn-scene');
 const descriptions={hall:'长桌之间留出通道，连通吧台、厨房与楼梯。',bar:'靠北墙的长吧台，负责酒水与餐食接待。',kitchen:'西侧隔墙后的厨房，门口通向大厅。',yard:'西侧服务院落，从侧门进入旅店。',stairs:'东北角的折返楼梯通往二层客房。'};
 root.querySelectorAll('[data-zone]').forEach(button=>button.addEventListener('click',()=>{
   root.querySelectorAll('[data-zone]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
   root.querySelector('.inn-description').textContent=descriptions[button.dataset.zone];
 }));
})();</script>
