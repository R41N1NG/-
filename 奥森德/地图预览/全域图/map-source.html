<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奥克赫斯 · 全域勘界图</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:20px;background:#080605;color:#e8dfd3;font:14px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}
    .journal{max-width:1320px;margin:auto;padding:24px;background:radial-gradient(ellipse at 50% 0,#251c12,#100c09 90%);border:1px solid #dfc89a40;border-radius:3px}
    header{text-align:center;margin-bottom:17px}
    .kicker{font:10px/1.6 Georgia,serif;letter-spacing:2.5px;color:#ac9876}
    h1{font:500 25px/1.7 "Songti SC",SimSun,serif;letter-spacing:4px;color:#fff5e3;margin:6px 0 4px}
    header p{font:12px/1.6 "Songti SC",SimSun,serif;letter-spacing:3px;color:#b3a594;margin:0}
    .rule{display:flex;align-items:center;gap:14px;margin:15px 0 0;color:#dfc89a;font-size:9px}
    .rule:before,.rule:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#dfc89a70)}
    .rule:after{transform:rotate(180deg)}
    figure{position:relative;margin:0;isolation:isolate}
    figure>img{display:block;width:100%;height:auto;border-radius:2px}
    .place{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);font:600 16px/1.6 "Songti SC",SimSun,serif;color:#482c18;white-space:nowrap;text-align:center;padding:2px 8px;background:linear-gradient(90deg,#f1d0a100,#f1d0a1c2 20%,#f1d0a1c2 80%,#f1d0a100)}
    .place small{display:block;font:12px/1.5 "Songti SC",SimSun,serif;letter-spacing:1px;color:#74502f}
    .farm{font-size:12px;font-weight:500;color:#674427}
    footer{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:#ad9876;font:11px/1.6 "Songti SC",SimSun,serif;letter-spacing:1px}
    @media(max-width:600px){body{padding:8px}.journal{padding:15px 9px 12px}h1{font-size:20px;letter-spacing:2px}.kicker{font-size:9px;letter-spacing:1px}.place{font-size:12px;padding:0 3px}.place small{display:none}.farm{font-size:11px}.farm.secondary{display:none}footer{font-size:10px;letter-spacing:0}}
  </style>
</head>
<body>
  <main class="journal">
    <header><span class="kicker">OAKHAVEN CHRONICLES · TERRITORY SURVEY</span><h1>奥克赫斯 · 全域勘界图</h1><p>镇子及周边疆域</p><div class="rule" aria-hidden="true">❖</div></header>
    <figure aria-label="全域空间草案：农舍与田地环绕奥克赫斯镇，西南入镇道路穿过峡口与窄桥，东北山上为领主庄园，东南为不与人类道路相连的敌对兽人营地，其周边是贫瘠乱石荒地。">
      <img src="regional-art.webp" width="1536" height="1024" alt="古朴羊皮纸全域地图。险道沿西南河谷穿行，镇外四周分布农耕地，庄园位于镇外山上，兽人营地孤立于干裂岩地，没有通往镇子的道路。">
      <span class="place" style="--x:33.5%;--y:51%">奥克赫斯镇</span>
      <span class="place" style="--x:68%;--y:28.5%">领主庄园<small>镇外 · 山上</small></span>
      <span class="place" style="--x:80%;--y:66%">黑兽人营地<small>敌对驻地</small></span>
      <span class="place farm" style="--x:34%;--y:37%">镇外农耕带</span>
      <span class="place farm secondary" style="--x:35%;--y:84%">农舍 · 耕地</span>
      <span class="place farm" style="--x:11%;--y:74%">峡口险道</span>
    </figure>
    <footer><span>第一层 · 全域图</span><span>空间草案 · 未标定距离</span></footer>
  </main>
</body>
</html>
