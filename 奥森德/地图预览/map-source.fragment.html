<style>
#okh-map-study{--okh-bg-outer:#080605;--okh-gold-light:#fff5e3;--okh-gold-main:#dfc89a;--okh-gold-dim:#9c8a70;--okh-gold-line:rgba(223,200,154,.28);--okh-text-main:#e8dfd3;--okh-text-sub:#b3a594;--okh-text-dim:#8a7c6a;--om-paper-light:.82;color-scheme:dark}
#okh-map-study .om-journal{padding:22px;background:radial-gradient(ellipse at 50% 15%,#201912,#0e0b08 90%);color:var(--okh-text-main);border:1px solid var(--okh-gold-line);border-radius:4px;font:13px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;box-sizing:border-box}
#okh-map-study .om-journal *{box-sizing:border-box}
#okh-map-study .om-crest{font:10px/1.5 Georgia,"Songti SC",serif;text-align:center;letter-spacing:2px;color:var(--okh-gold-dim);margin-bottom:20px}
#okh-map-study .om-head{display:flex;align-items:end;gap:12px;justify-content:space-between}
#okh-map-study .om-kicker{font-size:11px;letter-spacing:2px;color:var(--okh-gold-dim)}
#okh-map-study .om-head h2{font:500 23px/1.6 "Cinzel","Songti SC",SimSun,serif;letter-spacing:2px;margin:2px 0 0;color:var(--okh-gold-light)}
#okh-map-study .om-folio{font:11px/2 Georgia,serif;letter-spacing:2px;color:var(--okh-gold-dim);white-space:nowrap}
#okh-map-study .om-rule{display:flex;align-items:center;gap:12px;margin:15px 0;color:var(--okh-gold-main);font-size:9px}
#okh-map-study .om-rule::before,#okh-map-study .om-rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--okh-gold-line))}
#okh-map-study .om-rule::after{transform:rotate(180deg)}
#okh-map-study .om-topline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--okh-text-sub)}
#okh-map-study button{font-family:inherit}
#okh-map-study button:focus-visible{outline:2px solid var(--okh-gold-main);outline-offset:4px}
#okh-map-study .om-fold{border:0;background:transparent;padding:5px 0;color:var(--okh-gold-dim);font-size:11px}
#okh-map-study .om-map{position:relative;height:370px;isolation:isolate;background:#211a13;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 36px #08060570}
#okh-map-study .om-geography{position:absolute;inset:0;width:100%;height:100%;opacity:var(--om-paper-light);z-index:-1}
#okh-map-study .om-map::after{position:absolute;content:"";inset:0;pointer-events:none;box-shadow:inset 0 0 36px #08060590;z-index:2}
#okh-map-study .om-map-title{position:absolute;top:18px;left:18px;font:500 16px/1.6 "Songti SC",SimSun,serif;letter-spacing:2px;color:#c5ae86}
#okh-map-study .om-map-title small{font:10px/1.8 "Songti SC",SimSun,serif;letter-spacing:1px;display:block;color:#af9c7c}
#okh-map-study .om-north{position:absolute;right:20px;top:15px;display:flex;align-items:center;flex-direction:column;color:#c9b086}
#okh-map-study .om-north span{font:11px/1.3 "Songti SC",SimSun,serif}
#okh-map-study .om-north b{font:400 35px/1 Georgia,serif}
#okh-map-study .om-region{position:absolute;color:#af9672;opacity:.62;font:11px/1.5 "Songti SC",SimSun,serif;letter-spacing:3px;pointer-events:none}
#okh-map-study .om-region-town{left:37%;top:84%}
#okh-map-study .om-region-wilds{left:76%;top:72%;writing-mode:vertical-rl;letter-spacing:4px}
#okh-map-study .om-node{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;align-items:center;flex-direction:column;background:transparent;color:#d8c29b;border:0;padding:5px 3px;min-width:48px;min-height:44px;z-index:3;gap:2px;transition:color .18s}
#okh-map-study .om-mark{display:grid;place-items:center;width:34px;height:34px;position:relative}
#okh-map-study .om-mark svg{width:26px;height:26px;stroke-width:1.15;filter:drop-shadow(0 2px 2px #100a06)}
#okh-map-study .om-mark i{display:block;width:22px;height:22px}
#okh-map-study .om-mark i::after{content:"◇";font:24px/1 Georgia,serif}
#okh-map-study .om-node-label{font:500 12px/1.8 "Songti SC",SimSun,serif;white-space:nowrap;text-shadow:0 1px 3px #100a06,0 0 5px #100a06}
#okh-map-study .om-node:hover,#okh-map-study .om-node[aria-pressed="true"]{color:var(--okh-gold-light)}
#okh-map-study .om-node[aria-pressed="true"] .om-mark::after{content:"";position:absolute;inset:-4px;border:1px solid #dfc89a80;border-radius:50%;box-shadow:0 0 15px #dfc89a10}
#okh-map-study .om-current-label{font-size:10px;color:#e9d4a8;letter-spacing:1px}
#okh-map-study .om-map-foot{position:absolute;bottom:12px;left:18px;right:18px;display:flex;justify-content:space-between;gap:8px;font:9px/1.5 Georgia,"Songti SC",serif;color:#b5a181;letter-spacing:1px}
#okh-map-study .om-corner{position:absolute;width:13px;height:13px;border-color:#dfc89a66;border-style:solid;pointer-events:none;z-index:3}
#okh-map-study .om-tl{top:5px;left:5px;border-width:1px 0 0 1px}
#okh-map-study .om-br{bottom:5px;right:5px;border-width:0 1px 1px 0}
#okh-map-study .om-detail{padding:16px 0 0}
#okh-map-study .om-detail-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}
#okh-map-study .om-detail-heading h3{font:500 16px/1.7 "Songti SC",SimSun,serif;color:var(--okh-gold-light);margin:0}
#okh-map-study .om-detail-heading>span{font-size:11px;color:var(--okh-gold-dim)}
#okh-map-study .om-detail p{margin:6px 0 12px;color:var(--okh-text-sub);font-size:12px}
#okh-map-study .om-detail-action{display:flex;justify-content:space-between;align-items:center;gap:12px}
#okh-map-study .om-detail-action>span{font-size:11px;color:var(--okh-gold-dim)}
#okh-map-study .om-prepare{flex:none;background:#dfc89a12;color:var(--okh-gold-main);border:1px solid var(--okh-gold-line);border-radius:2px;font-size:12px;padding:6px 13px}
#okh-map-study .om-prepare:disabled{opacity:.55}
#okh-map-study .om-intent{border-top:1px solid var(--okh-gold-line);padding-top:13px;margin-top:16px}
#okh-map-study .om-intent label{display:block;color:var(--okh-gold-main);font-size:11px;margin-bottom:6px}
#okh-map-study .om-intent textarea{display:block;width:100%;border:1px solid var(--okh-gold-line);border-radius:2px;background:#08060588;color:var(--okh-text-main);font:13px/1.6 inherit;padding:9px;resize:vertical}
#okh-map-study .om-draft-status{font-size:11px;color:var(--okh-text-sub);margin:7px 0 0}
#okh-map-study [hidden]{display:none!important}
@media(max-width:480px){#okh-map-study .om-journal{padding:17px 12px}#okh-map-study .om-crest{font-size:9px}#okh-map-study .om-map{height:410px}#okh-map-study .om-map-title{font-size:13px;left:10px;top:15px}#okh-map-study .om-map-title small{font-size:10px}#okh-map-study .om-head h2{font-size:21px}#okh-map-study .om-folio{display:none}#okh-map-study .om-mark svg{width:23px;height:23px}#okh-map-study .om-node-label{font-size:11px}#okh-map-study .om-map-foot>span:first-child{display:none}#okh-map-study .om-map-foot{font-size:10px}#okh-map-study .om-region-wilds{left:85%;top:68%}#okh-map-study .om-detail-action{align-items:flex-start}#okh-map-study .om-detail-action>span{max-width:62%}}
@media(pointer:coarse){#okh-map-study .om-fold,#okh-map-study .om-prepare{min-height:44px}#okh-map-study .om-intent textarea{font-size:16px}}
@media(prefers-reduced-motion:reduce){#okh-map-study .om-node{transition:none}}
</style>
<script>
(() => {
  const root = document.getElementById('okh-map-study');
  const places = {
    town: {name:'中央集市大道',state:'当前所在',desc:'银月珠宝铺近旁。街巷与各处地标在此交汇。',presence:'示例场景 · 爱德、伊丝娜在场',route:''},
    inn: {name:'断剑与麦酒',state:'城内 · 旅店',desc:'城镇中的旅店。沿街巷返回落脚处。',presence:'同伴动向待接入',route:'M480 288Q316 368 240 414'},
    church: {name:'圣辉大教堂',state:'城内 · 教堂',desc:'从集市街区沿道路前往大教堂。',presence:'同伴动向待接入',route:'M480 288Q339 217 280 168'},
    manor: {name:'领主山庄',state:'城内 · 山庄',desc:'山庄位于图卷上方，具体出入条件以剧情为准。',presence:'同伴动向待接入',route:'M480 288Q550 240 620 120'},
    casino: {name:'地下赌场',state:'城内 · 地下',desc:'此标记表示地面入口方位，地下空间另行绘制。',presence:'同伴动向待接入',route:'M480 288Q565 350 640 432'},
    wilds: {name:'城外荒原',state:'城外',desc:'经城门离开城镇，进入荒原。',presence:'荒原态势待接入',route:'M480 288Q608 293 751 302T860 294'}
  };
  const name = root.querySelector('#om-detail-name');
  const stateLabel = root.querySelector('#om-detail-state');
  const desc = root.querySelector('#om-detail-desc');
  const presence = root.querySelector('#om-detail-presence');
  const prepare = root.querySelector('#om-prepare');
  const route = root.querySelector('.om-route');
  const body = root.querySelector('#om-map-body');
  const fold = root.querySelector('.om-fold');
  let selected = 'town';
  function select(id) {
    if (!Object.hasOwn(places,id)) return;
    selected = id;
    const place = places[id];
    root.querySelectorAll('[data-place]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.place === id)));
    name.textContent = place.name;stateLabel.textContent = place.state;desc.textContent = place.desc;presence.textContent = place.presence;
    prepare.disabled = id === 'town';prepare.textContent = id === 'town' ? '已在此处' : '准备前往 ↗';
    route.setAttribute('d', place.route);route.style.visibility = place.route ? 'visible' : 'hidden';
  }
  root.querySelectorAll('[data-place]').forEach(button => button.addEventListener('click', () => select(button.dataset.place)));
  fold.addEventListener('click', () => {body.hidden = !body.hidden;fold.setAttribute('aria-expanded', String(!body.hidden));fold.textContent = body.hidden ? '展开图卷 ＋' : '收起图卷 −';});
  prepare.addEventListener('click', () => {
    if (selected === 'town') return;
    const value = '我准备前往' + places[selected].name + '。';
    const intent = root.querySelector('.om-intent');const draft = root.querySelector('#om-draft');
    intent.hidden = false;draft.value = value;
    // 独立外观预览：只展示行动草稿，不写存档、不改变当前位置、不发送消息。
    draft.dispatchEvent(new Event('input',{bubbles:true}));
  });
  select('town');
  const design = {paper:82,accent:'#dfc89a'};
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root,onChange:()=>{root.style.setProperty('--om-paper-light',design.paper/100);root.style.setProperty('--okh-gold-main',design.accent);}});
    tweak.addSlider(design,'paper',{label:'地图纸面明度',min:55,max:100,unit:'%'});
    tweak.addColorPicker(design,'accent',{label:'手札金色',reference:'--okh-gold-main'});
  }
})();
</script>
