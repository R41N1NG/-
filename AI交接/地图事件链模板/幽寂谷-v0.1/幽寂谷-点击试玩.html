function initial(identity='自设',stamp=open){return {version:1,identity,stamp,step:'map',turn:0,created:0,visited:[],used:[],mutex:{},known:{},inventory:[],log:[],receipt:null,run:0};}

if(a.finish||a.early){const days=a.early?config.earlyDays:config.completeDays;n.receipt={id:`youjigu-${n.run}`,type:a.early?'提前离开':'正常完成',days,from:n.stamp,to:n.stamp+days,rewards:[...n.inventory],summary:[...n.log]};n.stamp+=days;n.step='done';}return {ok:true,state:n};}

const E=Youjigu,$=id=>document.getElementById(id),key='xsd-youjigu-v01';let state=E.initial(),history=[],notice='';

const names={map:'南疆地图',first:'第一轮 · 选择探索方向',cave:'洞府 · 两处机缘',stream:'山涧 · 自由探查',second:'第二轮 · 深入探索',valley:'山谷 · 出口在前',secret:'密室 · 二选一',done:'结算完成'};
const descriptions={map:'确认身份后，点击地图标记进入幽寂谷。',first:'洞府保留3轮，山涧保留5轮。这里的“轮”是自由活动回复次数。',cave:'香炉与暗格只能选择一项。选定后，另一项立即消失。',stream:'可查看溪水、树丛，也可自由活动后离开。',second:'选择继续探索的区域。',valley:'可收集草药，或从出口结束本次事件。',secret:'你已凭地图进入密室。两侧暗格只能开启一个；正式剧情待填。',done:'本次事件已结束，以下为脚本核算的回执。重新试玩请打开“试行设置”。'};

function render(){ $('date').textContent=E.date(state.stamp)+' · '+state.identity+' · 对话 '+state.turn+' 轮';$('phase').textContent=state.step==='map'?'南疆 · 地图选择':'幽寂谷 · '+(state.step==='done'?'事件已结束':'事件进行中');$('title').textContent=names[state.step];$('intro').textContent=descriptions[state.step]+(!['map','done'].includes(state.step)?' '+E.config.budget:'');$('notice').textContent=notice;$('actions').replaceChildren();for(const a of E.options(state)){if(a.from==='map')continue;const b=document.createElement('button');b.textContent=a.label+(a.remaining!==null?' · 剩余'+a.remaining+'轮':'')+(a.blocked?'（'+a.blocked+'）':'');b.disabled=!!a.blocked;b.onclick=()=>commit(E.act(state,a.id));$('actions').append(b);}if(state.step==='first'&&!E.options(state).some(a=>a.ttl)){const b=document.createElement('button');b.textContent='第一轮入口已过期 · 进入第二轮';b.onclick=()=>commit(E.next(state));$('actions').append(b);}$('enter').disabled=!!E.reason(state,'g7p2');$('enter').textContent=state.step==='map'?(state.stamp<E.open?'幽寂谷 · 尚未开放':state.stamp>E.close?'幽寂谷 · 已过期':'幽寂谷 · 进入'):state.step==='done'?'幽寂谷 · 已结束':'幽寂谷 · 探索中';$('chat').hidden=['map','done'].includes(state.step);$('bag').replaceChildren();for(const item of state.inventory){const span=document.createElement('span');span.className='tag';span.textContent=item;$('bag').append(span);}if(!state.inventory.length)$('bag').textContent='行囊尚空';$('known').textContent=state.known.map_youjigu?'已知条件：已获得幽寂谷地图':'尚未取得地图条件';$('log').replaceChildren();for(const line of state.log){const li=document.createElement('li');li.textContent=line;$('log').append(li);}$('receipt').replaceChildren();if(state.receipt){const p=document.createElement('p');p.className='receipt';p.textContent=state.receipt.type+' · 世界时间推进 '+state.receipt.days+' 日（测试值）\n'+E.date(state.receipt.from)+' → '+E.date(state.receipt.to)+'。获得：'+(state.receipt.rewards.join('、')||'无')+'。';$('receipt').append(p);}$('undo').disabled=!history.length;}
$('enter').onclick=()=>commit(E.act(state,'g7p2'));$('talk').onclick=()=>{const r=E.talk(state,$('text').value);commit(r);if(r.ok)$('text').value='';};$('undo').onclick=()=>{if(history.length){state=history.pop();notice='已恢复上一步日期、条件、互斥和轮数。';persist();render();}};$('reset').onclick=()=>{const m=Number($('month').value),d=Number($('day').value);if(!Number.isInteger(m)||m<1||m>12||!Number.isInteger(d)||d<1||d>30){notice='请输入有效月份和日期';render();return;}state=E.initial($('identity').value,E.day(1578,m,d));history=[];notice='';persist();render();};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({state,history},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='幽寂谷-试玩存档.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();
