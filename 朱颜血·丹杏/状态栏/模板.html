<div class="zyx-hud" role="region" aria-label="朱颜血丹杏态势仪">
  <header class="zyx-hud-head"><strong>❖ 朱颜血·丹杏 <span>· 态势仪</span></strong><span class="zyx-hud-chapter">【宣德 · 边陲风云】</span></header>
  <div class="zyx-hud-grid">
    <div class="zyx-hud-row"><div class="zyx-hud-pill zyx-hud-time"><span aria-hidden="true">时</span><span class="zyx-hud-value">$<time></span></div><div class="zyx-hud-pill zyx-hud-place"><span aria-hidden="true">地</span><span class="zyx-hud-value">$<location></span></div></div>
    <div class="zyx-hud-row zyx-hud-env-row"><div class="zyx-hud-pill zyx-hud-weather"><span aria-hidden="true">候</span><span class="zyx-hud-value">$<weather></span></div><div class="zyx-hud-pill zyx-hud-senses"><span aria-hidden="true">境</span><span class="zyx-hud-value">$<environment></span></div></div>
    <div class="zyx-hud-tools">
      <details class="zyx-hud-tool zyx-hud-growth"><summary><span class="zyx-hud-tool-icon">武</span><span>本轮所悟 · <span class="zyx-hud-value">$<growth_skill></span></span><span class="zyx-hud-drop" aria-hidden="true">⌄</span></summary><div class="zyx-hud-popover"><h4>武学札记</h4><dl><dt>所练所悟</dt><dd class="zyx-hud-value">$<growth_skill></dd><dt>领悟契机</dt><dd class="zyx-hud-value">$<growth_reason></dd><dt>成长分量</dt><dd><span class="zyx-hud-value">$<growth_weight></span><small>一为常悟，二为大悟；无则未记成长。</small></dd></dl></div></details>
      <div class="zyx-hud-pill zyx-hud-elapsed"><span aria-hidden="true">时</span><span>历时 <span class="zyx-hud-value">$<elapsed></span></span></div>
      <details class="zyx-hud-tool zyx-hud-record"><summary>▤ 案簿</summary><div class="zyx-hud-popover"><h4>人物动向</h4><dl><dt>白雪莲</dt><dd class="zyx-hud-value">$<bailian_state></dd><dt>薛霜灵</dt><dd class="zyx-hud-value">$<shuangling_state></dd><dt>伤亡勘验</dt><dd class="zyx-hud-value">$<roster_event></dd></dl></div></details>
    </div>
  </div>
  <section class="zyx-hud-trend"><div class="zyx-hud-trend-head"><b>天下大势</b><strong>边陲暗流 · 本轮气象</strong></div><p class="zyx-hud-value">$<crisis></p></section>
  <section class="zyx-hud-companion">
    <div class="zyx-hud-avatar" aria-hidden="true"></div>
    <div class="zyx-hud-companion-body">
      <div class="zyx-hud-person"><h3 class="zyx-hud-value">$<favor_char></h3><span class="zyx-hud-role-tag">当前镜头</span><span class="zyx-hud-stage">❖【<span class="zyx-hud-value">$<favor_stage></span>】</span><span class="zyx-hud-aura">◈ 心防气象 · <span class="zyx-hud-value">$<favor_aura></span></span></div>
      <p class="zyx-hud-reason"><b>【心防因由】</b><span class="zyx-hud-value">$<favor_reason></span></p>
      <div class="zyx-hud-main"><p class="zyx-hud-mind"><b>【内心心声】</b><span class="zyx-hud-value">$<favor_mind></span></p><p class="zyx-hud-demeanor"><b>【形貌姿态】</b><span class="zyx-hud-value">$<favor_companion></span></p></div>
      <details class="zyx-hud-subfold"><summary>在场他人<span aria-hidden="true"> ↗</span></summary><div class="zyx-hud-extra"><article class="zyx-hud-extra-person"><h4>$<e1_name></h4><div class="zyx-hud-extra-fields"><span class="zyx-hud-extra-stage">$<e1_stage></span><span class="zyx-hud-extra-aura">$<e1_aura></span><p><em>心声</em><span class="zyx-hud-value">$<e1_mind></span></p><p><em>形貌</em><span class="zyx-hud-value">$<e1_demeanor></span></p></div></article><article class="zyx-hud-extra-person"><h4>$<e2_name></h4><div class="zyx-hud-extra-fields"><span class="zyx-hud-extra-stage">$<e2_stage></span><span class="zyx-hud-extra-aura">$<e2_aura></span><p><em>心声</em><span class="zyx-hud-value">$<e2_mind></span></p><p><em>形貌</em><span class="zyx-hud-value">$<e2_demeanor></span></p></div></article><p class="zyx-hud-extra-empty">未记在场他人。</p></div></details>
    </div>
  </section>
  <section class="zyx-hud-clue"><span aria-hidden="true">察</span><b>【重要线索】</b><p class="zyx-hud-value">$<clue></p></section>
  <div class="zyx-hud-rumors"><section><h4>【本地风闻】</h4><p class="zyx-hud-value">$<news_near></p></section><section><h4>【远地风闻】</h4><p class="zyx-hud-value">$<news_mid></p></section></div>
</div>
