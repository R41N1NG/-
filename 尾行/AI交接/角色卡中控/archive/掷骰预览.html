<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尾行 · d20 掷骰预览</title>
<style>
  :root{ --bg:#0b0e13; --panel:#141926; --line:#232c40; --tx:#c8d3e8; --dim:#5d6b85;
         --hot:#e0566a; --cool:#4f8fd6; --gold:#d6b96a; --ok:#7fd6a4; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--tx); font:15px/1.7 "Microsoft YaHei",system-ui,sans-serif;
        min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px 16px 60px; }
  h1{ font-size:19px; letter-spacing:2px; color:#e8eefb; }
  h1 small{ font-size:12px; color:var(--dim); letter-spacing:1px; margin-left:10px; font-weight:normal;}
  .sub{ color:var(--dim); font-size:13px; margin:6px 0 10px; text-align:center;}

  .stage{ position:relative; width:100%; max-width:720px; height:300px; display:flex; align-items:center;
          justify-content:center; gap:70px; margin:8px 0 4px; }
  .dieSlot{ position:relative; width:150px; height:230px; display:flex; align-items:center; justify-content:center; perspective:700px; }
  .shadow{ position:absolute; bottom:6px; left:50%; width:120px; height:18px; transform:translateX(-50%);
           background:radial-gradient(ellipse at center, rgba(0,0,0,.55), transparent 70%); }
  .die{ position:absolute; width:132px; height:132px; transform-style:preserve-3d; will-change:transform;
        filter:drop-shadow(0 0 18px rgba(80,160,255,.14)); }
  .face{ position:absolute; left:0; top:0; width:132px; height:132px; backface-visibility:hidden; }
  .face svg{ display:block; width:132px; height:132px; overflow:visible; }
  .face text{ font:600 24px Consolas,monospace; fill:#8fb0e0; letter-spacing:.5px;
              filter:url(#tGlow); transition:fill .2s; }
  .face.lit text{ fill:#fff; }
  /* 全站氛围：扫描线 + 噪点 */
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px); }
  body::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:9; opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>"); }

  .result{ min-height:120px; width:100%; max-width:720px; text-align:center; margin-top:2px; }
  .big{ font:700 46px Consolas,monospace; color:#fff; opacity:0; transform:scale(.4); transition:.25s cubic-bezier(.2,1.6,.4,1); }
  .big.show{ opacity:1; transform:scale(1); }
  .big.nat1{ color:var(--hot); text-shadow:0 0 22px rgba(224,86,106,.8);}
  .big.nat20{ color:var(--gold); text-shadow:0 0 22px rgba(214,185,106,.9);}
  .verdict{ font-size:14px; letter-spacing:1px; margin-top:2px; min-height:22px; }
  .verdict.ok{ color:var(--ok);} .verdict.bad{ color:var(--hot);} .verdict.gold{ color:var(--gold);}
  .flow{ font:13px Consolas,monospace; color:var(--dim); margin-top:6px; min-height:20px; }
  .flow b{ color:var(--tx); font-weight:normal;}
  .lock{ font-size:12px; color:var(--dim); margin-top:4px; opacity:0; transition:.3s;}
  .lock.show{ opacity:1;}
  .lock .ok{ color:var(--cool);}

  .row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px;}
  button{ background:#1b2338; color:var(--tx); border:1px solid var(--line); border-radius:6px;
          padding:10px 22px; font-size:15px; cursor:pointer; transition:.15s;}
  button:hover:not(:disabled){ border-color:var(--cool); color:#fff;}
  button:disabled{ opacity:.35; cursor:wait;}
  button.primary{ background:#24365c; border-color:var(--cool);}
  .flash{ position:fixed; inset:0; pointer-events:none; opacity:0; }
  .flash.f1{ background:radial-gradient(ellipse at center, rgba(224,86,106,.28), transparent 65%); }
  .flash.f20{ background:radial-gradient(ellipse at center, rgba(214,185,106,.30), transparent 65%); }
  .flash.go{ animation:fl .55s ease-out; }
  @keyframes fl{ 0%{opacity:0;} 18%{opacity:1;} 100%{opacity:0;} }
  .shake{ animation:sh .4s; }
  @keyframes sh{ 0%,100%{transform:translate(0,0);} 20%{transform:translate(-7px,2px);} 40%{transform:translate(6px,-3px);} 60%{transform:translate(-4px,3px);} 80%{transform:translate(3px,-1px);} }
  footer{ color:var(--dim); font-size:12px; margin-top:22px; text-align:center; line-height:1.9;}
</style>
</head>
<body>
  <h1>尾行 · d20 掷骰预览<small>CSS 3D 正二十面体 · 种子锁定演示</small></h1>
  <div class="sub">掷出 → 翻滚 → 落定对准 → 流水结算。优势/劣势为双骰取高/低。</div>

  <div class="stage" id="stage">
    <div class="dieSlot" id="slotA"><div class="shadow"></div><div class="die" id="dieA"></div></div>
    <div class="dieSlot" id="slotB" style="display:none"><div class="shadow"></div><div class="die" id="dieB"></div></div>
  </div>

  <div class="result">
    <div class="big" id="big"></div>
    <div class="verdict" id="verdict"></div>
    <div class="flow" id="flow"></div>
    <div class="lock" id="lock">🔒 已锁定（种子 = 楼号 + 会话指纹 · 重开同结果）</div>
  </div>

  <div class="row">
    <button class="primary" id="roll">掷骰</button>
    <button id="adv">优势掷（取高）</button>
    <button id="dis">劣势掷（取低）</button>
  </div>

  <footer>落定动画 = 抛掷弹道 + 角速度衰减 + 四元数最短路径对准目标面<br>正式版：骰值由中控种子决定，本页为动画与演出验收。</footer>

<div class="flash" id="flash"></div>

<!-- 共享 SVG defs：面渐变 / 辉光 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22355c" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#152340" stop-opacity=".94"/>
      <stop offset="1" stop-color="#0e1830" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="faceGradLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6db8"/>
      <stop offset=".55" stop-color="#28498a"/>
      <stop offset="1" stop-color="#1c3266"/>
    </linearGradient>
    <filter id="edgeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>

<script>
(() => {
/* ---------- 向量 / 四元数 ---------- */
const V = {
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm:a=>{const l=V.len(a)||1; return [a[0]/l,a[1]/l,a[2]/l];}
};
const Q = {
  id:()=>[0,0,0,1],
  fromAxis:(ax,ang)=>{const s=Math.sin(ang/2); return [ax[0]*s,ax[1]*s,ax[2]*s,Math.cos(ang/2)];},
  mul:(a,b)=>[
    a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],
    a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],
    a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],
    a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]],
  conj:q=>[-q[0],-q[1],-q[2],q[3]],
  rotateVec:(q,v)=>{
    const [x,y,z]=v;
    const qv=[q[0],q[1],q[2]], qw=q[3];
    const t=V.mul(V.cross(qv,v),2);
    return V.add(V.add(v,V.mul(t,qw)),V.cross(qv,t));
  },
  slerp:(a,b,t)=>{
    let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];
    let bb=b;
    if(d<0){ bb=[-b[0],-b[1],-b[2],-b[3]]; d=-d; }
    if(d>0.9995){ // 极接近时线性插值即可
      return [a[0]+(bb[0]-a[0])*t, a[1]+(bb[1]-a[1])*t, a[2]+(bb[2]-a[2])*t, a[3]+(bb[3]-a[3])*t];
    }
    const th=Math.acos(d), s=Math.sin(th);
    const wa=Math.sin((1-t)*th)/s, wb=Math.sin(t*th)/s;
    return [a[0]*wa+bb[0]*wb, a[1]*wa+bb[1]*wb, a[2]*wa+bb[2]*wb, a[3]*wa+bb[3]*wb];
  },
  toCSS:q=>{
    const [x,y,z,w]=q;
    const m=[
      1-2*(y*y+z*z), 2*(x*y-z*w), 2*(x*z+y*w),
      2*(x*y+z*w), 1-2*(x*x+z*z), 2*(y*z-x*w),
      2*(x*z-y*w), 2*(y*z+x*w), 1-2*(x*x+y*y)
    ];
    return `matrix3d(${m[0]},${m[3]},${m[6]},0, ${m[1]},${m[4]},${m[7]},0, ${m[2]},${m[5]},${m[8]},0, 0,0,0,1)`;
  }
};

/* ---------- 正二十面体 ---------- */
function icosahedron(){
  const f=(1+Math.sqrt(5))/2;
  let verts=[[-1,f,0],[1,f,0],[-1,-f,0],[1,-f,0],[0,-1,f],[0,1,f],[0,-1,-f],[0,1,-f],[f,0,-1],[f,0,1],[-f,0,-1],[-f,0,1]];
  verts=verts.map(V.norm);
  const EDGE=2/Math.hypot(1,f); // 归一化后的棱长
  const faces=[];
  for(let i=0;i<12;i++)for(let j=i+1;j<12;j++)for(let k=j+1;k<12;k++){
    const d=(a,b)=>Math.abs(V.len(V.sub(verts[a],verts[b]))-EDGE)<1e-6;
    if(d(i,j)&&d(j,k)&&d(i,k)) faces.push([verts[i],verts[j],verts[k]]);
  }
  return faces.map((f,idx)=>{
    const c=V.norm(V.mul(V.add(V.add(f[0],f[1]),f[2]),1/3));
    const n=c;
    let u=V.norm(V.sub(f[0],V.mul(n,V.dot(f[0],n)))); // 面内基 u（指向顶点0）
    const w=V.cross(n,u);
    return {idx, c, n, u, w, verts:f};
  });
}
const FACES=icosahedron();
const SIZE=132;

/* 目标旋转：行 = (-u, w, n)，使面法线 n 朝屏幕外、数字正立（div 局部 -y 朝屏幕上方） */
function targetQuat(face){
  const m=[-face.u[0],-face.u[1],-face.u[2],
           face.w[0],face.w[1],face.w[2],
           face.n[0],face.n[1],face.n[2]]; // 行主序 3x3
  // 3x3(行主序) -> 四元数
  const tr=m[0]+m[4]+m[8];
  let q;
  if(tr>0){ const S=Math.sqrt(tr+1)*2; q=[(m[7]-m[5])/S,(m[2]-m[6])/S,(m[3]-m[1])/S,S/4]; }
  else if(m[0]>m[4]&&m[0]>m[8]){ const S=Math.sqrt(1+m[0]-m[4]-m[8])*2; q=[S/4,(m[1]+m[3])/S,(m[2]+m[6])/S,(m[7]-m[5])/S]; }
  else if(m[4]>m[8]){ const S=Math.sqrt(1+m[4]-m[0]-m[8])*2; q=[(m[1]+m[3])/S,S/4,(m[5]+m[7])/S,(m[2]-m[6])/S]; }
  else { const S=Math.sqrt(1+m[8]-m[0]-m[4])*2; q=[(m[2]+m[6])/S,(m[5]+m[7])/S,S/4,(m[3]-m[1])/S]; }
  return V.norm(q);
}

/* ---------- 骰子组件 ---------- */
function buildDie(el){
  const faceEls=[];
  FACES.forEach(face=>{
    const d=document.createElement('div');
    d.className='face';
    // 面基矩阵：列 u,w,n → 平移到面中心（乘半径）
    const R=0.98;
    const c=V.mul(face.c,R);
    const m=new DOMMatrix([
      face.u[0],face.u[1],face.u[2],0,
      face.w[0],face.w[1],face.w[2],0,
      face.n[0],face.n[1],face.n[2],0,
      c[0]*SIZE/2, c[1]*SIZE/2, c[2]*SIZE/2, 1
    ]);
    d.style.transform=m.toString();
    d.style.transformOrigin='0 0';
    // 三角形顶点（viewBox 坐标）
    const pts=face.verts.map(v=>{
      const p=V.sub(v,face.c).map(x=>x*R);
      return [66+ V.dot(p,face.u)/SIZE*132, 66- V.dot(p,face.w)/SIZE*132];
    });
    const tri=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    d.innerHTML=`<svg viewBox="0 0 132 132">
      <polygon points="${tri}" fill="url(#faceGrad)" stroke="rgba(126,188,255,.5)"
               stroke-width="1.4" stroke-linejoin="round" filter="url(#edgeGlow)" class="tri"/>
      <text x="66" y="66" text-anchor="middle" dominant-baseline="central">${face.idx+1}</text>
    </svg>`;
    el.appendChild(d);
    faceEls.push(d);
  });
  return faceEls;
}

const dieA=document.getElementById('dieA'), dieB=document.getElementById('dieB');
const facesA=buildDie(dieA), facesB=buildDie(dieB);

function setLit(faceEls,idx){
  faceEls.forEach((d,i)=>{
    const on=i===idx;
    d.classList.toggle('lit',on);
    const tri=d.querySelector('.tri');
    if(tri){
      tri.setAttribute('fill', on?'url(#faceGradLit)':'url(#faceGrad)');
      tri.setAttribute('stroke', on?'rgba(160,215,255,.95)':'rgba(126,188,255,.5)');
      tri.setAttribute('stroke-width', on?'2':'1.4');
    }
  });
}

/* 掷一颗：target 数字 1-20 */
function rollOne(die, faceEls, target, delay=0){
  return new Promise(res=>{
    const face=FACES[target-1];
    const qT=targetQuat(face);
    let q=Q.id(), axis=V.norm([Math.random()-.5,Math.random()-.5,Math.random()-.5]);
    let speed=13+Math.random()*4;
    let phase='spin', t0=null, q0=null;
    let bounceY=0, start=null, alive=true;
    setTimeout(()=>{ start=performance.now(); loop(); }, delay);
    function apply(){
      die.style.transform=`translateY(${bounceY}px) `+Q.toCSS(q);
    }
    // setTimeout 驱动而非 rAF：webview 节流时 rAF 停摆会卡死动画，setTimeout 顶多变慢
    function loop(){
      if(!alive) return;
      step(performance.now());
      if(phase!=='done') setTimeout(loop, 16);
    }
    function step(now){
      const dt=Math.min((now-(step._l||now))/1000,0.15); step._l=now;
      const t=(now-start)/1000;
      if(phase==='spin'){
        axis=V.norm(V.add(axis,V.mul(V.norm([Math.random()-.5,Math.random()-.5,Math.random()-.5]),0.12)));
        q=Q.mul(q,Q.fromAxis(axis,speed*dt));
        speed=Math.max(speed*(1-dt*1.1), 0.001+10*(1-Math.min(t/0.85,1)));
        if(t>0.85){ phase='align'; q0=q; t0=t; }
      }else if(phase==='align'){
        const k=Math.min((t-t0)/0.55,1);
        const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
        q=Q.slerp(q0,qT,e);
        if(k>=1){ phase='settle'; }
      }else if(phase==='settle'){
        q=qT;
      }
      // 抛掷弹道（0~0.55s 上抛，重力回落，一次小弹）
      if(t<0.55){ const u=t-0.02; bounceY=-(330*u - 750*u*u)*0.9; if(bounceY>0)bounceY=0; }
      else if(t<0.85){ const u=(t-0.55)/0.3; bounceY=-Math.sin(u*Math.PI)*16; }
      else bounceY=0;
      apply();
      if(phase==='settle'){ phase='done'; alive=false; setLit(faceEls,target-1); res(target); return; }
    }
  });
}

/* ---------- 模拟检定流水 ---------- */
const SCENES=[
  {name:'跟速检定', dc:15, mods:[['敏捷',5],['耳机伪装',2]]},
  {name:'贴身尾随', dc:19, mods:[['敏捷',5],['夜色',2]]},
  {name:'拍照', dc:13, mods:[['情报',8],['长焦',4]]},
  {name:'读时机', dc:15, mods:[['情报',8]]},
  {name:'搭话', dc:13, mods:[['口才',9]]},
];
const big=document.getElementById('big'), verdict=document.getElementById('verdict'),
      flow=document.getElementById('flow'), lock=document.getElementById('lock'),
      flash=document.getElementById('flash'), stage=document.getElementById('stage');
function seedRand(){ return Math.floor(Math.random()*20)+1; }

async function doRoll(mode){ // mode: 'normal' | 'adv' | 'dis'
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  big.className='big'; verdict.textContent=''; flow.textContent=''; lock.classList.remove('show');
  setLit(facesA,-1); setLit(facesB,-1);
  const scene=SCENES[Math.floor(Math.random()*SCENES.length)];
  const dual=mode!=='normal';
  document.getElementById('slotB').style.display=dual?'flex':'none';
  stage.style.gap=dual?'40px':'70px';

  let d1=seedRand(), d2=dual?seedRand():0;
  const p1=rollOne(dieA,facesA,d1);
  const p2=dual?rollOne(dieB,facesB,d2,120):Promise.resolve(0);
  const [r1,r2]=await Promise.all([p1,p2]);

  const raw=dual?(mode==='adv'?Math.max(d1,d2):Math.min(d1,d2)):d1;
  const modsSum=scene.mods.reduce((s,m)=>s+m[1],0);
  const total=raw+modsSum;
  const nat=raw===1?'n1':raw===20?'nat20':'';

  big.textContent=raw;
  big.className='big show '+nat;
  if(nat==='n1'){ flash.className='flash f1'; document.body.classList.add('shake');
                  verdict.textContent='天然 1 · 危机 —— 走选择：咽下事故，或付代价抵消'; verdict.className='verdict bad'; }
  else if(nat==='nat20'){ flash.className='flash f20'; verdict.textContent='天然 20 · 大成功加彩 —— 白拿一条额外收益'; verdict.className='verdict gold'; }
  else{ const ok=total>=scene.dc;
        verdict.textContent=(total>=scene.dc+5?'大成功':ok?'成功':(total>=scene.dc-2?'勉强（蹭掉一层皮）':'失败'));
        verdict.className='verdict '+(ok?'ok':'bad'); }
  void flash.offsetWidth; flash.classList.add('go');
  setTimeout(()=>document.body.classList.remove('shake'),450);

  const modsTxt=scene.mods.map(m=>`+${m[1]} ${m[0]}`).join(' ');
  flow.innerHTML=`[${scene.name}] 1d20(<b>${d1}</b>${dual?(mode==='adv'?' / ':' ⊗ ')+d2:''}) ${modsTxt} = <b>${total}</b> vs DC ${scene.dc}`;
  setTimeout(()=>lock.classList.add('show'),350);
  document.querySelectorAll('button').forEach(b=>b.disabled=false);
}

document.getElementById('roll').addEventListener('click',()=>doRoll('normal'));
document.getElementById('adv').addEventListener('click',()=>doRoll('adv'));
document.getElementById('dis').addEventListener('click',()=>doRoll('dis'));
/* 初始静置一面 */
(function(){ const q=targetQuat(FACES[13]); dieA.style.transform=Q.toCSS(q); setLit(facesA,13); })();
})();
</script>
</body>
</html>
