<main id="wx-zero-floor" class="day-course-shell">
  <section id="dayCourse" hidden aria-labelledby="dayCourseTitle">
    <header class="day-course-top">
      <span>全息潜行训练 / 日程与尾行</span
      ><button type="button" id="dayCourseSkipAll">一键跳过所有教程 ↗</button>
    </header>
    <nav id="dayCourseNav" aria-label="第二组教程章节"></nav>
    <div class="day-course-heading">
      <span id="dayCourseCount"></span>
      <h1 id="dayCourseTitle" tabindex="-1"></h1>
      <p id="dayCourseLead"></p>
    </div>
    <div id="dayCourseCards" class="day-course-cards"></div>
    <div
      id="dayCourseSituations"
      role="group"
      aria-label="跟随过程的不同情形"
      hidden
    ></div>
    <div id="dayCourseSituationCopy" class="day-course-situation" hidden>
      <h2 id="dayCourseSituationTitle"></h2>
      <p id="dayCourseSituationText"></p>
    </div>
    <figure class="day-course-figure">
      <figcaption id="dayCourseCaption"></figcaption>
      <div id="dayCoursePicture"></div>
    </figure>
    <footer class="day-course-footer">
      <button type="button" id="dayCoursePrev">← 上一页</button
      ><span>阅读、翻页和框选不消耗行动点</span
      ><button type="button" id="dayCourseNext"></button>
    </footer>
  </section>
  <section id="dayCourseDone" hidden>
    <h1>训练说明</h1>
    <p id="dayCourseDoneText" role="status"></p>
    <a
      href="https://github.com/R41N1NG/-/blob/codex/weixing-v0.8.19-pi-familiarity/尾行/AI交接/角色卡中控/previews/college-schedule/index.html"
      >下载配套日程试玩 ↗</a
    >
  </section>
</main>
