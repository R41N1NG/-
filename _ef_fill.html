window.__RAW = "黄沙沿着残破的土墙缝隙刮进客栈，在粗糙的胡桃木案上积出寸许厚的细尘。\n\n门外的大荒风道呜咽作响，夹杂着远处断续传来的几声低沉兽吼。浑身浸透黑血的瘦削道人踉跄着撞开半扇破烂木门，脚步虚浮，整个人扑倒在长案前。他胸口那道贯穿的斧痕深可见骨，残存的护体灵光早已彻底溃散，干瘪的手指颤抖着探入怀中，沾满脓血的手掌死死攥着一柄由太古灵兽玄骨打磨而成的骨卷。\n\n骨卷通体温润，哪怕沾染着污血，表面依然流淌着异样的暗金微光，仿佛活物脉搏般起伏微动。\n\n那重伤垂死的道人甚至没能看清眼前人的面容，喉头嗬嗬作响，只是拼着最后一股溃散的气力，将那卷沉甸甸的玄骨硬生生推递过来，塞入案边那双平稳放着的衣袖之间。\n\n“……拿着……走……”\n\n道人干瘪的嘴唇开合两下，瞳孔骤然散开，伏在案头再没了声息。\n\n以此身入太微红尘，且看百花谁主沉浮。\n\n骨卷甫一入怀，表面浮动的金光古篆便自暗处隐现，《极乐引》三字透骨生温，诸天至阴体质的诸般图谱与纯阳锻灵的法门如繁星般在骨质脉络间暗暗隐没，旋即彻底敛去灵光，化作一卷看似寻常的古旧骨匣。\n\n客栈外骤然掠过两道凶戾的气息。\n\n沉重的脚步声将门槛外的黄土踩得陷下数寸，花间二鬼那庞大的阴影直接遮住了破旧的门洞。走在前面的王大身材矮小如侏儒，双颊凹陷，两柄泛着惨绿毒光的短刃在袖底轻巧地转动，一双浑浊泛黄的眼睛在昏暗的客栈堂内逡巡；落后半步的王二则足有近丈高，浑身横肉虬结，门板般的开山巨斧随意搭在宽阔的肩头，斧刃上还残留着尚未凝固的暗红肉糜。\n\n“跑得倒挺快，在这咽气了。”\n\n王二沉闷如雷的嗓音震得房梁上的灰尘扑簌簌往下落，粗壮的脚掌直接跨过门槛，鞋底将客栈掌柜丢在地上的破算盘踩得粉碎。\n\n王大身形微顿，短刃在指尖挑了个花，鼻翼轻微抽动了两下，目光越过地上气绝的尸首，落在了长案旁那道安然端坐的玄衣身影上。他浑浊的眼珠转了转，视线滑过案角残留的一缕暗淡灵气，嘴角咧开一口参差不齐的焦黄牙齿。\n\n“大哥，你看那小子。”王二那张覆满横肉的大脸凑了过来，巨斧在掌心里颠了颠，凶光毕露，“练气圆满的泥腿子，腰里连个像样的储物袋都没有，怕是荒原上捡漏的散修。”\n\n王大并未立刻上前，脚跟微错，整个人如同一只弓起背脊的野狐，谨慎地贴着侧方柜台游移。淬毒的短刃抵在掌心，他的视线在客栈内外打量了一圈，尖锐沙哑的声音自喉咙里挤出：“这老杂毛身上的东西，落在谁手里可不好说。小子，把怀里的物件掏出来，摆在桌上。”\n\n话音未落，客栈斜上方的风沙中骤然荡开一声清越的铮鸣。\n\n那不是刀剑相碰的杂音，而是古朴琴弦被灵力拨动后泛起的空灵音波。肉眼可见的月白涟漪穿透客栈残破的茅草屋顶，如同春雨般轻柔却极具韧性地垂落下来，恰好将王大逼近的身形阻在三尺开外。\n\n“哎呀，姐姐你看，我就说这破客栈里有血腥气吧！”\n\n娇憨清脆的嗓音伴随着轻巧的落步声传进堂内。客栈二楼坍塌的栏杆上，少女身着月白道袍，棕色短发扎成两只短短的跳脱马尾，随着她探头张望的动作轻轻晃动。她指间捏着一支通体晶莹的碧玉洞箫，杏眼弯弯，视线在王大王二身上转了一圈，最后落在长案前安静的身影上，樱桃小口微张，好奇地眨了眨眼。\n\n紧随其后的苏瑶轻飘飘落在一层断柱旁。同样是月白流仙裙，她的棕色长发却规整地盘成两个包子髻，一支素银簪斜插其间，显得沉静内敛。她膝前悬浮着一张古朴木琴，纤细的手指轻搭在冰冷的琴弦上，警惕地隔开王大与王二，温和清润的眸光在长案前略作停顿，随即便谨慎地移向那两位荒漠凶徒。\n\n“天音阁弟子在此巡山，二位道友，手脚放干净些。”\n\n苏瑶声音清冷沉稳，指腹在琴弦上微不可察地扣紧，整个人横在堂心，俨然将案边端坐的练气散修护在了琴音阵纹之后。\n\n王大停住脚步，三角眼死死盯着苏瑶的古琴，又扫了一眼栏杆上晃荡着双腿的苏玲，握着淬毒短刃的手腕微微绷紧，客栈内的空气顿时凝固如铁。\n\n<Status_block>\n<时间>仙盟历 1578 年 · 三月</时间>\n<历时>—</历时>\n<地点>大荒边陲 · 黄沙客栈破堂</地点>\n<天气>烈风卷沙，天地昏黄</天气>\n<环境>粗粝血腥气 · 风穿破壁的呼啸 · 琴音余波荡起的微凉</环境>\n<在场>王大、王二、苏瑶、苏玲</在场>\n<暗处>无</暗处>\n<身份>大荒散修、瑾岐橘</身份>\n<修为>练气圆满</修为>\n<状态>灵力充盈｜毫发无损｜心境：古井无波</状态>\n<目标>收纳机缘，冷眼旁观局势变化</目标>\n<局势>花间二鬼堵截夺宝，天音阁听雪双姝横插介入</局势>\n<线索>起获并暗藏上古奇珍《极乐引》（窥见十三名器与纯阳锻灵玄机）</线索>\n<近闻>西北荒漠有邪修出没掳掠低阶炉鼎，各派巡山弟子频出</近闻>\n<远闻>南域重地幽寂谷古秘境封印松动，定于盛夏开启</远闻>\n<危机>王大王二意欲杀人夺宝，四方气机交错如弦</危机>\n<关系刻度>苏瑶、警惕相护 +0｜苏玲、好奇打量 +0｜花间二鬼、贪婪杀意 +1</关系刻度>\n<进度>极乐引入手已达成</进度>\n<实际发生>极乐引入手</实际发生>\n<角色1><名>苏瑶</名><阶段>初识 +0</阶段><情况>抚琴凝神</情况><心境>不愿见无辜散修横死邪修之手</心境><神态>月白裙摆微拂，双指压在木琴宫商二弦，目光沉静防备</神态></角色1>\n<角色2><名>苏玲</名><阶段>初识 +0</阶段><情况>娇俏张望</情况><心境>对长案边临危不乱的散修充满探究</心境><神态>晃荡着悬空的绣鞋，指尖转动碧玉洞箫，杏眼骨碌打转</神态></角色2>\n<角色3><名>王大</名><阶段>敌对 +1</阶段><情况>伺机而动</情况><心境>盘算天音阁两名金丹女修的底细与骨卷去向</心境><神态>佝偻身躯微沉，淬毒短刃反扣袖内，三角眼泛着阴鸷戾气</神态></角色3>\n</Status_block>\n\n<tse_meta x=\"0.1\" y=\"0.2\" target=\"苏瑶\" sweet=\"done\">\n<player_mind>安坐冷观风云变幻，以体面姿态任由名门仙姝介入挡局，静待机锋自显</player_mind>\n</tse_meta>";
