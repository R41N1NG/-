    #okh-gulan-dossier-unified-light h1, #okh-gulan-dossier-unified-light p, #okh-gulan-dossier-unified-light dl,
    #okh-gulan-dossier-unified-light dd, #okh-gulan-dossier-unified-light figure { margin: 0; }
    #okh-gulan-dossier-unified-light button, #okh-gulan-dossier-unified-light textarea { font: inherit; }
    #okh-gulan-dossier-unified-light button {
      appearance: none;
      color: inherit;
      cursor: pointer;
    }
    #okh-gulan-dossier-unified-light button:focus-visible,
    #okh-gulan-dossier-unified-light summary:focus-visible,
    #okh-gulan-dossier-unified-light textarea:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }
    #okh-gulan-dossier-unified-light .okh-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: 0 27px;
      border-bottom: 1px solid var(--rule);
      background: #17130e8c;
    }
    #okh-gulan-dossier-unified-light .okh-title {
      display: flex;
      gap: 11px;
      align-items: center;
      color: var(--gold);
      font: 600 14px/1.4 "Noto Serif CJK SC", "Songti SC", serif;
      letter-spacing: .12em;
    }
    #okh-gulan-dossier-unified-light .okh-title::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border: 1px solid #b18e56;
      transform: rotate(45deg);
    }
    #okh-gulan-dossier-unified-light .okh-quiet {
      min-height: 40px;
      padding: 7px 0 7px 10px;
      background: none;
      border: 0;
      color: var(--dim);
      font-size: 12px;
    }
    #okh-gulan-dossier-unified-light .okh-quiet:hover { color: var(--ivory); }
    #okh-gulan-dossier-unified-light .okh-dossier {
      display: grid;
      grid-template-columns: minmax(0, 0.91fr) minmax(0, 1.09fr);
      align-items: start;
      gap: clamp(22px, 4vw, 42px);
      padding: 27px;
    }
    #okh-gulan-dossier-unified-light .okh-portrait-column { min-width: 0; }
    #okh-gulan-dossier-unified-light .okh-portrait {
      display: block;
      width: 100%;
      padding: 4px;
      border: 1px solid #79613e;
      border-radius: 2px;
      background: #1a1713;
    }
    #okh-gulan-dossier-unified-light .okh-portrait:hover { border-color: var(--gold); }

      ];
      const thumbs = [...root.querySelectorAll("[data-art]")];
      const panels = [...root.querySelectorAll("[data-view]")];
      const images = {
        neutral: { label: "平日", src: portrait.querySelector("img").src },
        smile: { label: "微笑", src: find('[data-art="smile"] img').src },
        focus: { label: "凝神", src: find('[data-art="focus"] img').src }
      };
      const headings = { dossier: "角色档案", image: "回忆相册", roster: "同伴名册" };
      let chosen = "neutral";
      let enlarged = "neutral";
      let activeView = "dossier";
      let imageTrigger = portrait;
      let moduleTrigger;
      let hoveredPart = null;
      let focusedPart = null;
      let pinnedPart = null;
      let describedPart = null;
      let displayedPart = null;
      let hoverTimer;

      function amount(value, unit) {
        return Number.isFinite(value) && value >= 0 ? `${value} ${unit}` : "未记录";
      }

      function partCount(key) {
        return amount(activity.encountersByPart[key], "次");
      }

      find("[data-total-volume]").textContent = amount(activity.totalVolumeMl, "mL");

      function displayPart(key) {
        if (displayedPart === key) return;
        displayedPart = key;
        partRecords.hidden = Boolean(key);
        partSpecific.hidden = partHighlight.hidden = !key;
        if (!key) return;
        partHighlight.dataset.region = key;
        const part = parts[key];
        partTitle.textContent = part.title;
        partImage.src = part.image;
        partImage.alt = part.artAlt;
        const facts = [...part.facts, ["性行为次数", partCount(key)]];
        partFacts.replaceChildren(...facts.map(([label, value]) => {
          const row = document.createElement("div");
          const term = document.createElement("dt");
          const description = document.createElement("dd");
          term.textContent = label;
          description.textContent = value;
          row.append(term, description);
          return row;
        }));
      }

      function positionPartPopover(trigger) {
        const frame = partFigure.getBoundingClientRect();
        const target = trigger.getBoundingClientRect();
        const width = partPopover.offsetWidth;
        const height = partPopover.offsetHeight;
        const gap = 8;
        const onRight = target.right - frame.left + gap;
        const onLeft = target.left - frame.left - width - gap;
        const above = target.top - frame.top - height - gap;
        const below = target.bottom - frame.top + gap;
        let x = (target.left + target.right) / 2 - frame.left + gap;
        let y = above >= 0 ? above : below;
        if (onRight + width <= frame.width || onLeft >= 0) {
          x = onRight + width <= frame.width ? onRight : onLeft;
          y = (target.top + target.bottom - height) / 2 - frame.top;
        }
        x = Math.max(0, Math.min(x, frame.width - width));
        y = Math.max(0, Math.min(y, frame.height - height));
        partPopover.style.setProperty("--popover-left", `${x}px`);
        partPopover.style.setProperty("--popover-top", `${y}px`);
      }

      function showPartPopover() {
        const trigger = hoveredPart || pinnedPart || focusedPart;
        displayPart(trigger?.dataset.partHit ?? null);
        if (describedPart !== trigger) {
          describedPart?.removeAttribute("aria-describedby");
          trigger?.setAttribute("aria-describedby", partPopover.id);
          describedPart = trigger;
        }
        partPopover.hidden = !trigger;
        if (!trigger) return;
        const key = trigger.dataset.partHit;
        const part = parts[key];
        partPopover.querySelector("strong").textContent = part.title;
        partPopover.querySelector("p").textContent = part.summary;
        popoverCount.textContent = partCount(key);
        positionPartPopover(trigger);
      }

      function endHover() {
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => {
          hoveredPart = null;
          showPartPopover();
        }, 140);
      }

      function dismissPartPopover() {
        clearTimeout(hoverTimer);
        hoveredPart = null;
        focusedPart = null;
        pinPart(null);
        showPartPopover();
      }

      function pinPart(trigger) {
        pinnedPart = trigger;
        hotspots.forEach(hit => hit.setAttribute("aria-pressed", String(hit === trigger)));
      }

      pinPart(null);
      hotspots.forEach((hit) => {
        hit.addEventListener("pointerenter", (event) => {
          if (event.pointerType === "touch") return;
          clearTimeout(hoverTimer);
          hoveredPart = hit;
          showPartPopover();
        });
        hit.addEventListener("pointerleave", (event) => {
          if (event.pointerType !== "touch") endHover();
        });
        hit.addEventListener("focus", () => {
          focusedPart = hit;
          showPartPopover();
        });
        hit.addEventListener("blur", () => {
          if (focusedPart === hit) focusedPart = null;
          showPartPopover();
        });
        hit.addEventListener("click", () => {
          if (pinnedPart === hit) {
            dismissPartPopover();
            return;
          }
          pinPart(hit);
          showPartPopover();
        });
      });
      partPopover.addEventListener("pointerenter", () => clearTimeout(hoverTimer));
      partPopover.addEventListener("pointerleave", endHover);
      window.addEventListener("resize", showPartPopover);
      moduleBody.addEventListener("click", (event) => {
        if (!event.target.closest("[data-part-hit], [data-part-popover]")) dismissPartPopover();
      });

      function show(view, focus) {
        if (view !== "module") dismissPartPopover();
        activeView = view;
        heading.textContent = view === "module" ? moduleTrigger.getAttribute("aria-label") : headings[view];
        panels.forEach((panel) => { panel.hidden = panel.dataset.view !== view; });
        back.hidden = view === "roster";
        back.textContent = view === "image" || view === "module" ? "返回档案　×" : "返回名册　×";
        focus.focus({ preventScroll: true });
        root.scrollIntoView({ block: "nearest" });
      }

      function showBloodline() {
        const value = bloodSlider.valueAsNumber;
        const stage = bloodStages.find(({ maximum }) => value <= maximum);
        root.style.setProperty("--blood-progress", `${value}%`);
        bloodValue.textContent = value;
        bloodState.textContent = stage.name;
        bloodMeter.setAttribute("aria-valuenow", value);
        bloodMeter.setAttribute("aria-valuetext", `${value} / 100，${stage.name}`);
        bloodSlider.setAttribute("aria-valuetext", `${value} / 100，${stage.name}`);
        if (formImage.dataset.stage !== stage.name) {
          formImage.src = stage.image;
          formImage.alt = stage.form;
          formImage.dataset.stage = stage.name;
          bloodArt.style.setProperty("--eye-strength", stage.eye?.strength ?? 0);
          if (stage.eye) {
            bloodArt.style.setProperty("--eye-x", `${stage.eye.x}%`);
            bloodArt.style.setProperty("--eye-y", `${stage.eye.y}%`);
            bloodArt.style.setProperty("--eye-light", stage.eye.color);
          }
        }
      }

      function restoreBloodline(widgetState) {
        const value = widgetState?.privateContent?.gulanBloodline;
        if (Number.isInteger(value) && value >= 0 && value <= 100) bloodSlider.value = value;
        showBloodline();
      }

      restoreBloodline(window.openai?.widgetState);
      window.addEventListener("openai:set_globals", (event) => {
        restoreBloodline(event.detail?.globals?.widgetState);
      });
      bloodSlider.addEventListener("input", showBloodline);
      bloodSlider.addEventListener("change", () => {
        window.openai?.setWidgetState?.({ privateContent: { gulanBloodline: bloodSlider.valueAsNumber } })?.catch(() => {});
      });

      function syncDefault() {
        portrait.querySelector("img").src = images[chosen].src;
        reopen.querySelector("img").src = images[chosen].src;
        thumbs.forEach((thumb) => {
          if (thumb.dataset.art === chosen) thumb.setAttribute("aria-current", "true");
          else thumb.removeAttribute("aria-current");
        });
        setDefault.disabled = enlarged === chosen;
        setDefault.textContent = setDefault.disabled ? "当前默认立绘" : "设为默认立绘";
      }

      function openImage(key, trigger) {
        enlarged = key;
        imageTrigger = trigger;
        const entry = images[key];
        displayImage.src = entry.src;
        displayImage.alt = "古兰 · " + entry.label;
        caption.textContent = displayImage.alt;
        syncDefault();
        show("image", back);
      }

      back.addEventListener("click", () => {
        if (activeView === "image") show("dossier", imageTrigger);
        else if (activeView === "module") show("dossier", moduleTrigger);
        else show("roster", reopen);
      });
      root.querySelectorAll("[data-module]").forEach((entry) => {
        entry.addEventListener("click", () => {
          moduleTrigger = entry;
          const module = entry.dataset.module;
          const isSilhouette = module === "sigil";
          moduleView.dataset.openModule = module;
          moduleArt.hidden = isSilhouette;
          moduleEmpty.hidden = isSilhouette;
          moduleBody.hidden = !isSilhouette;
          if (!isSilhouette) moduleArt.src = entry.querySelector("img").src;
          show("module", back);
        });
      });
      root.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !back.hidden) {
          event.preventDefault();
          if (!partPopover.hidden) dismissPartPopover();
          else back.click();
        }
      });
      reopen.addEventListener("click", () => show("dossier", back));
      portrait.addEventListener("click", () => openImage(chosen, portrait));
      thumbs.forEach((thumb) => {
        thumb.addEventListener("click", () => openImage(thumb.dataset.art, thumb));
      });
      setDefault.addEventListener("click", () => { chosen = enlarged; syncDefault(); back.focus(); });
      root.querySelectorAll("[data-draft]").forEach((button) => {
        button.addEventListener("click", () => {
          const text = button.dataset.draft;
          draft.value = draft.value.trim() ? draft.value.trimEnd() + "\n" + text : text;
          feedback.textContent = "已填入行动草稿";
          show("roster", draft);
          draft.setSelectionRange(draft.value.length, draft.value.length);
        });
      });
    })();
  </script>
</div>
</body>
</html>
